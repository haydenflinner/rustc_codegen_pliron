# Generated by `harness/dev.py hack` -- do not edit by hand.
#
# Feature unification for the workspace (docs/dev-loop.md): the union of the
# features that the different cargo package selections (`cargo build`, `-p
# pliron-clif-check`, `-p rustc_codegen_pliron`, `cargo test -p ...`) turn on
# in shared third-party crates. pliron-cfg depends on this crate, so every
# selection builds the same cranelift-codegen and the same pliron-clif-opt
# instead of one copy per command. Rerun the generator after changing
# dependencies or their features; `harness/dev.py hack --check` verifies it.
[package]
name = "pliron-hack"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "lib.rs"

[dependencies]
anyhow = { version = "1.0.104", features = ["std"] }
bitflags = { version = "2.13.2", default-features = false, features = ["std"] }
byteorder = { version = "1.5.0", features = ["std"] }
cranelift-bitset = { version = "0.135.5", default-features = false, features = ["enable-serde"] }
cranelift-codegen = { version = "0.135.5", default-features = false, features = ["enable-serde", "gimli", "host-arch", "incremental-cache", "postcard", "serde", "serde_derive", "sha2", "std", "timing", "unwind"] }
cranelift-entity = { version = "0.135.5", default-features = false, features = ["enable-serde", "serde", "serde_derive"] }
hashbrown = { version = "0.17.1", features = ["allocator-api2", "default-hasher", "equivalent", "inline-more", "raw-entry", "serde"] }
indexmap = { version = "2.14.2", features = ["std"] }
libc = { version = "0.2.190", features = ["std"] }
log = { version = "0.4.34", default-features = false, features = ["alloc", "std"] }
object = { version = "0.39.1", default-features = false, features = ["archive", "coff", "elf", "macho", "pe", "read_core", "std", "write", "write_core", "write_std", "xcoff"] }
postcard = { version = "1.1.3", features = ["alloc", "heapless", "heapless-cas"] }
regalloc2 = { version = "0.15.2", features = ["checker", "enable-serde", "serde", "std"] }
regex-automata = { version = "0.4.18", default-features = false, features = ["alloc", "dfa-build", "dfa-onepass", "dfa-search", "hybrid", "meta", "nfa-backtrack", "nfa-pikevm", "nfa-thompson", "perf-inline", "perf-literal", "perf-literal-multisubstring", "perf-literal-substring", "std", "syntax", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment", "unicode-word-boundary"] }
regex-syntax = { version = "0.8.11", features = ["std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"] }
serde = { version = "1.0.229", features = ["alloc", "derive", "serde_derive", "std"] }
smallvec = { version = "1.16.2", default-features = false, features = ["const_generics", "serde", "union"] }
target-lexicon = { version = "0.13.5", features = ["std"] }
thiserror = { version = "2.0.21", features = ["std"] }
tracing-core = { version = "0.1.36", features = ["once_cell", "std"] }
typenum = { version = "1.20.1", default-features = false, features = ["const-generics"] }
