name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      - name: Doc tests
        run: cargo test --all-features --doc

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: features

      # Every architecture backend is a feature, so the core has to keep
      # building with all of them off. This is what stops the generic half of
      # the assembler from quietly growing a dependency on one backend — the
      # trait in `arch::Architecture` is only a real seam if the crate
      # compiles with nothing behind it.
      - name: Build with no backends
        run: cargo build --no-default-features

      - name: Clippy with no backends
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      # Each backend on its own, so no feature can come to depend on another
      # being enabled alongside it. The list is read out of Cargo.toml rather
      # than repeated here, so adding a backend cannot silently skip this.
      - name: Build and test each backend alone
        run: |
          set -euo pipefail
          features=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].features | keys[] | select(. != "default")')
          echo "backends: $(echo $features)"
          for f in $features; do
            echo "::group::$f"
            cargo build --no-default-features --features "$f"
            cargo test --no-default-features --features "$f"
            echo "::endgroup::"
          done

  cross_check:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # rsasm is a host tool, so what matters here is host properties the
        # x86-64 runners cannot exercise:
        #
        # * i686-unknown-linux-gnu — a 32-bit host. Section offsets, fragment
        #   sizes and file positions move between `u64` and `usize` all over
        #   the layout and ELF writer; on a 64-bit host a `usize` cast that
        #   should have been `u64` is invisible.
        # * s390x-unknown-linux-gnu — a big-endian host. Output byte order is
        #   the *target's*, never the host's, so every integer written to a
        #   section or an ELF field must go through an explicit conversion.
        #   A stray `to_ne_bytes` compiles and passes everywhere else.
        target: [i686-unknown-linux-gnu, s390x-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}

      # `cargo check` only: these need no native linker, and the point is to
      # compile the code, not to run it.
      - name: cargo check --all-features --all-targets
        run: cargo check --target ${{ matrix.target }} --all-features --all-targets

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Keep this pin in sync with `rust-version` in Cargo.toml. Compiling on
      # the declared minimum guards against accidentally using a std/library or
      # language feature newer than 1.89 (behavior itself is covered by the
      # stable `test` job, so this is compile-only).
      - name: Install Rust 1.89 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check --all-features --all-targets
        run: cargo check --all-features --all-targets

  mc_diff:
    name: Differential test against llvm-mc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: mc-diff

      # llvm-mc is the only oracle that covers every architecture in the
      # crate. It is pinned, because its answers change between releases and
      # an oracle whose answers depend on the runner image is not an oracle.
      # The corpora were verified against LLVM 22; the runner ships 18, which
      # disagrees on 9 of ~3,900 cases, none of them rsasm's fault:
      #
      # - LLVM 18 crashes ("unable to write nop sequence of 1 bytes") on a
      #   SPARC snippet 22 handles.
      # - LLVM 18 rejects valid Intel-syntax AVX gathers that 22 and GNU as
      #   accept.
      # - RISC-V `li` switched from `addiw` to `addi` between the two.
      - name: Install LLVM 22
        run: |
          set -euo pipefail
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      # Refuse to compare against anything but the pinned version, so a
      # future image or PATH change fails here, visibly, rather than as a
      # scatter of encoding "mismatches" that are really version drift.
      - name: Confirm the pinned oracle is the one in use
        run: |
          set -euo pipefail
          command -v llvm-mc llvm-objcopy
          llvm-mc --version | tee /dev/stderr | grep -q "LLVM version 22\." \
            || { echo "::error::llvm-mc is not LLVM 22"; exit 1; }

      # The output goes to a file and is printed before the status is acted
      # on. Actions runs these scripts under `bash -e`, so each one turns
      # that off first: otherwise a failing harness exits the step before
      # its log is printed, hiding exactly the diff needed to debug it.
      - name: tools/mc-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/mc-diff/run.sh > mc-diff.log 2>&1
          status=$?
          cat mc-diff.log
          # "0 matched" means the corpus never ran, which must not read as a pass.
          grep -qE -- "--- [1-9][0-9]* matched" mc-diff.log \
            || { echo "::error::mc-diff compared nothing"; exit 1; }
          exit $status

      # Mach-O objects against the same pinned llvm-mc, compared as
      # llvm-readobj reads them.
      - name: tools/macho-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/macho-diff/run.sh > macho-diff.log 2>&1
          status=$?
          cat macho-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" macho-diff.log \
            || { echo "::error::macho-diff compared nothing"; exit 1; }
          exit $status

  xas_diff:
    name: Differential tests against cross GNU as, vasm and GNU ld
    runs-on: ubuntu-latest
    env:
      # Outside target/, so rust-cache neither saves nor wipes it.
      RSASM_ORACLES: ${{ github.workspace }}/../oracles
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: xas-diff

      # m68k, SuperH, RX, RL78 and V850 have no llvm-mc support, so their
      # references are cross builds of binutils plus vasm. Building them takes
      # minutes, so the install is cached, keyed on the build script: that is
      # where the versions and checksums live, so bumping a reference rebuilds.
      # share/ holds the headers AS's 8051 corpus includes.
      - name: Cache the reference assemblers
        id: oracles
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../oracles/bin
            ${{ github.workspace }}/../oracles/share
          key: oracles-${{ runner.os }}-${{ hashFiles('tools/oracles/build.sh') }}

      - name: Build the reference assemblers
        if: steps.oracles.outputs.cache-hit != 'true'
        run: tools/oracles/build.sh

      # flat-diff assembles the LLVM-checked targets with llvm-mc before
      # linking, so it needs the same pinned LLVM as the mc_diff job.
      - name: Install LLVM 22
        run: |
          set -euo pipefail
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      # Same guards as mc-diff: the log goes to a file so a failure still
      # prints it, and a run that compared nothing is a failure, not a pass.
      # x86 against the pinned GNU as 2.47 rather than the runner's own, which
      # is older and assembles some of the corpus differently. The encodings
      # in tests/x86_encoding.rs were taken from these runs.
      - name: tools/gas-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/gas-diff/run.sh > gas-diff.log 2>&1
          status=$?
          cat gas-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" gas-diff.log \
            || { echo "::error::gas-diff compared nothing"; exit 1; }
          grep -q "skipping\|no pinned" gas-diff.log \
            && { echo "::error::gas-diff did not use the pinned GNU as, or skipped its object corpora"; exit 1; }
          exit $status

      - name: tools/xas-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/xas-diff/run.sh > xas-diff.log 2>&1
          status=$?
          cat xas-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" xas-diff.log \
            || { echo "::error::xas-diff compared nothing"; exit 1; }
          grep -q "REF-MISSING" xas-diff.log \
            && { echo "::error::a reference assembler is missing"; exit 1; }
          exit $status

      # Whole NASM programs against NASM itself: flat binaries byte for byte,
      # ELF objects section by section with relocations and global symbols.
      # NASM is built by the same oracles script the step above cached.
      - name: tools/nasm-diff/run.sh
        run: |
          set -uo pipefail
          tools/nasm-diff/run.sh > nasm-diff.log 2>&1
          status=$?
          cat nasm-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" nasm-diff.log \
            || { echo "::error::nasm-diff compared nothing"; exit 1; }
          grep -q "REF-MISSING" nasm-diff.log \
            && { echo "::error::NASM is missing"; exit 1; }
          exit $status

      # Flat binaries against the reference assembler's object linked by GNU
      # ld at the same base: page, split and paired values are only right if
      # they match what a linker computes.
      - name: tools/flat-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/flat-diff/run.sh > flat-diff.log 2>&1
          status=$?
          cat flat-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" flat-diff.log \
            || { echo "::error::flat-diff compared nothing"; exit 1; }
          exit $status

      # Files that switch targets with `.arch`, each part against its own
      # reference: the host's GNU as, llvm-mc or a cross GNU as.
      - name: tools/multiarch-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/multiarch-diff/run.sh > multiarch-diff.log 2>&1
          status=$?
          cat multiarch-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" multiarch-diff.log \
            || { echo "::error::multiarch-diff compared nothing"; exit 1; }
          exit $status

      # PE/COFF objects (`-f coff`) for x86-64, i386 and ARM64: whole objects
      # against llvm-mc, relocations against GNU as for mingw, which the
      # oracles script builds alongside the ELF cross assemblers.
      - name: tools/coff-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/coff-diff/run.sh > coff-diff.log 2>&1
          status=$?
          cat coff-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" coff-diff.log \
            || { echo "::error::coff-diff compared nothing"; exit 1; }
          grep -q "REF-MISSING" coff-diff.log \
            && { echo "::error::a reference assembler is missing"; exit 1; }
          exit $status

      # DWARF line tables, call frame information and the compilation units
      # `-g` makes, against cross GNU as or llvm-mc as each target follows.
      - name: tools/dwarf-diff/run.sh
        run: |
          set +e -uo pipefail
          tools/dwarf-diff/run.sh > dwarf-diff.log 2>&1
          status=$?
          cat dwarf-diff.log
          grep -qE -- "--- [1-9][0-9]* matched" dwarf-diff.log \
            || { echo "::error::dwarf-diff compared nothing"; exit 1; }
          grep -q "REF-MISSING" dwarf-diff.log \
            && { echo "::error::a reference assembler is missing"; exit 1; }
          exit $status

  cli_smoke:
    name: CLI end-to-end (assemble, link, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-smoke

      - name: Build
        run: cargo build --release

      # The unit tests check bytes; this checks that the bytes are a real
      # object file. A relocation with the wrong addend, a bad `sh_info`, or a
      # symbol in the wrong table all produce output that passes every
      # assertion in the test suite and still fails to link.
      - name: Assemble, link and run the example
        run: |
          set -euxo pipefail
          ./target/release/rsasm -o hello.o examples/hello.s
          readelf -hSsr hello.o
          ld -o hello hello.o
          test "$(./hello)" = "Hello from rsasm!"

      - name: Flat binary output
        run: ./target/release/rsasm -f bin -o hello.bin examples/hello.s && test -s hello.bin

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
