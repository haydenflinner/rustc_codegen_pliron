[package]
name = "pliron-clif-opt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ascent = { version = "0.8", default-features = false }
pliron-cfg = { path = "../pliron-cfg" }
pliron = { path = "../vendor/pliron", default-features = false, features = ["std"] }
cranelift-codegen = { version = "=0.135.5", default-features = false, features = ["std", "incremental-cache"] }
cranelift-module = "=0.135.5"
cranelift-interpreter = "=0.135.5"
target-lexicon = "0.13"
rustc-hash = "2"
smallvec = "1"
tracing = "0.1"
tracing-core = "0.1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.11"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cranelift-reader = "=0.135.5"
cranelift-frontend = "=0.135.5"
libc = "0.2"
