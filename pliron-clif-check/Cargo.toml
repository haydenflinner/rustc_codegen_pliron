[package]
name = "pliron-clif-check"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Replays differential-checker reports (`PLIRON_DIFFCHECK`) without rustc:
# builds in seconds and runs any CLIF step on a saved `before.clif`.
[[bin]]
name = "clif-check"
path = "src/main.rs"

[dependencies]
pliron-clif-opt = { path = "../pliron-clif-opt" }
cranelift-codegen = { version = "=0.135.5", default-features = false, features = ["std", "host-arch"] }
cranelift-module = "=0.135.5"
cranelift-reader = "=0.135.5"
rustc-hash = "2"
serde_json = "1"
target-lexicon = "0.13"
