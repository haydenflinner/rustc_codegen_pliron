[package]
name = "rustc_codegen_pliron"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["dylib"]

[dependencies]
rsasm = { version = "0.1.3", default-features = false, features = ["x86", "aarch64"] }
gimli = { version = "0.33", default-features = false, features = ["std", "write"] }
pliron = { path = "vendor/pliron", default-features = false, features = ["std"] }
pliron-llvm = { path = "vendor/pliron/pliron-llvm", default-features = false, features = ["std"] }
cranelift-codegen = { version = "0.135.5", default-features = false, features = ["std", "unwind", "host-arch", "timing"] }
cranelift-frontend = "0.135.5"
cranelift-module = "0.135.5"
cranelift-object = "0.135.5"
target-lexicon = "0.13"
object = { version = "0.39", default-features = false, features = ["std", "read_core", "write", "elf", "macho", "archive"] }
# The fat-LTO payload format (src/lto.rs).
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
smallvec = "1"
egg = "0.10"
ascent = { version = "0.8", default-features = false }
waffle = "0.3.2"
pliron-clif-opt = { path = "pliron-clif-opt" }
pliron-clif-lower = { path = "pliron-clif-lower" }
pliron-ir-opt = { path = "pliron-ir-opt" }
pliron-cfg = { path = "pliron-cfg" }
rustc-hash = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = ["pliron-clif-opt", "pliron-clif-lower", "pliron-clif-check", "pliron-ir-opt", "pliron-cfg", "bench"]
exclude = ["vendor"]

[profile.dev]
opt-level = 1
# Emitting full DWARF for ~100k lines of vendored cranelift + rustc
# glue costs build time and disk (Mach-O keeps debug in the .o files,
# so this shows up as smaller objects, not a smaller dylib). Line
# tables keep ICE locations readable. Revert for lldb variables.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Vendored backend: O3 so the dev dylib runs at ~release speed (the O1
# codegen was the gap — measure on a large file with -Ztime-passes
# `codegen_crate`). Costs ~2x on the rare vendored-cranelift rebuild;
# flip to 1 while patching ISLE/-meta. Note package-profile overrides
# can't come from the environment — use
# `--config 'profile.dev.package.cranelift-codegen.opt-level=N'` or
# .cargo/config.toml.
[profile.dev.package.cranelift-codegen]
opt-level = 3

# Vendored crates edited rarely (<=6 commits in two weeks, 2026-10-21):
# an incremental session per build variant is disk for no rebuild gain.
# cranelift-codegen/-interpreter, pliron and waffle stay incremental
# (edited often); `harness/objgc.py` collects their stale CGU objects.
[profile.dev.package.cranelift-reader]
incremental = false
[profile.dev.package.cranelift-object]
incremental = false
[profile.dev.package.cranelift-jit]
incremental = false
[profile.dev.package.cranelift-assembler-x64]
incremental = false
[profile.dev.package.regalloc2]
incremental = false

[package.metadata.rust-analyzer]
rustc_private = true

[patch.crates-io]
# One-line spill-priority change; see vendor/regalloc2/PLIRON_PATCH.md.
regalloc2 = { path = "vendor/regalloc2" }
# Frameless x64 leaf functions + unclamped masked br_table; see vendor/cranelift-codegen/PLIRON_PATCH.md.
cranelift-codegen = { path = "vendor/cranelift-codegen" }
# `elf_ie` TLS model setting and the R_X86_64_GOTTPOFF reloc; see vendor/cranelift-codegen/PLIRON_PATCH.md.
cranelift-codegen-meta = { path = "vendor/cranelift-codegen-meta" }
cranelift-object = { path = "vendor/cranelift-object" }
# x86-64 TLS @-modifier relocations (@tpoff/@dtpoff/@gottpoff/@tlsgd/@tlsld);
# see vendor/rsasm/PLIRON_PATCH.md.
rsasm = { path = "vendor/rsasm" }
# `psadbw`/`vpsadbw` for the u8x16 byte-sum fold; see
# vendor/cranelift-assembler-x64-meta/PLIRON_PATCH.md.
cranelift-assembler-x64 = { path = "vendor/cranelift-assembler-x64" }
cranelift-assembler-x64-meta = { path = "vendor/cranelift-assembler-x64-meta" }
# `x86_psadbw` arm for the exhaustive opcode match; see
# vendor/cranelift-interpreter/PLIRON_PATCH.md.
cranelift-interpreter = { path = "vendor/cranelift-interpreter" }
# `Scatter` instruction-format arm for the `vscatter` CLIF op; see
# vendor/cranelift-reader/PLIRON_PATCH.md.
cranelift-reader = { path = "vendor/cranelift-reader" }
# x64 call veneers for out-of-range imports; see vendor/cranelift-jit/PLIRON_PATCH.md.
cranelift-jit = { path = "vendor/cranelift-jit" }
# Edge-transfer local coalescing in localify; see vendor/waffle/PLIRON_PATCH.md.
waffle = { path = "vendor/waffle" }
