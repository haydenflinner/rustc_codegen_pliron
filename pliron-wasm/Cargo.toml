[package]
name = "pliron-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Optimized Cranelift IR -> waffle -> wasm32 object emit for rustc_codegen_pliron. Stable Rust: usable from non-rustc drivers."

[dependencies]
pliron = { path = "../vendor/pliron", default-features = false, features = ["std"] }
pliron-ir-opt = { path = "../pliron-ir-opt" }
pliron-clif-lower = { path = "../pliron-clif-lower" }
pliron-clif-opt = { path = "../pliron-clif-opt" }
pliron-cfg = { path = "../pliron-cfg" }
waffle = "0.3.2"
cranelift-codegen = { version = "0.135.5", default-features = false, features = ["std"] }
cranelift-module = "0.135.5"
smallvec = "1"
rustc-hash = "2"
ascent = { version = "0.8", default-features = false }
tracing = "0.1"
