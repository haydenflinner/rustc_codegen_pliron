change-id = "ignore"
[build]
docs = false
extended = false
optimized-compiler-builtins = false
# stage2 std is built by the pliron-compiled stage2 rustc, not uplifted from stage1
full-bootstrap = true
[llvm]
download-ci-llvm = false
[rust]
codegen-backends = ["pliron"]
deny-warnings = false
debug-assertions = false
channel = "nightly"
lld = false
incremental = false
# setup.sh appends a [target.*] linker stanza on Linux (cc-wild); macOS uses the system linker.
