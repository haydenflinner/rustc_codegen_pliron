[package]
name = "raproof"
version = "0.1.0"
edition = "2024"
description = "Exact register lower/upper bounds on regalloc2 interference graphs (clique + colouring certificates)."

[dependencies]
regalloc2 = { path = "../../vendor/regalloc2", default-features = false, features = ["std", "pliron-fuzz"] }
arbitrary = "1.4.2"

[profile.release]
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
panic = "unwind"

[workspace]
